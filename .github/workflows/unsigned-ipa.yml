name: unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true
          if ! command -v tuist >/dev/null 2>&1; then
            brew install --formula tuist || curl -Ls https://install.tuist.io | bash || true
          fi
          for d in "$HOME/.local/bin" "$HOME/.tuist/bin" "$HOME/.local/share/tuist/bin"; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          export PATH="$HOME/.local/bin:$HOME/.tuist/bin:$HOME/.local/share/tuist/bin:$PATH"
          command -v tuist && tuist version || { echo "::error::tuist not installed"; exit 1; }

      - name: Generate project (Tuist)
        run: |
          set -euo pipefail
          tuist install || true
          tuist generate --no-open
          ls -d *.xcworkspace *.xcodeproj 2>/dev/null || true

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild archive \
            -workspace HermesMobile.xcworkspace \
            -scheme HermesMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" || {
              echo "::error::archive failed — last 200 lines below"
              tail -n 200 "$RUNNER_TEMP/archive.log"
              exit 1
            }

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          echo "app bundle: $app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist" || true
          echo "--- embedded targets ---"
          ls -1 "$app" | head -40
          ls -1 "$app/PlugIns" 2>/dev/null || echo "(no PlugIns)"
          mkdir -p "$RUNNER_TEMP/pkg/Payload"
          cp -R "$app" "$RUNNER_TEMP/pkg/Payload/"
          cd "$RUNNER_TEMP/pkg"
          zip -qry "$RUNNER_TEMP/HermesMobile-unsigned.ipa" Payload
          ls -lh "$RUNNER_TEMP/HermesMobile-unsigned.ipa"
          shasum -a 256 "$RUNNER_TEMP/HermesMobile-unsigned.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/HermesMobile-unsigned.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: |
            ${{ env.IPA_PATH }}
            ${{ runner.temp }}/archive.log
          if-no-files-found: error
          retention-days: 14
